name: GTA VI clipper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "campaigns = only streamers from your paid campaigns (config.yaml)"
        type: choice
        options: [campaigns, top GTA VI streams]
        default: campaigns
      hours:
        description: "How long to watch (max 5.5 per run)"
        default: "5.5"
      channels:
        description: "Only these channels, comma-separated (blank = top GTA VI streams)"
        default: ""
      top_n:
        description: "How many top streams to watch at once"
        default: "5"
      sensitivity:
        description: "Clip sensitivity"
        type: choice
        options: [normal, more clips, fewer clips]
        default: normal
      keep_going:
        description: "Start a new run when this one ends (cancel the run to stop)"
        type: boolean
        default: false
      runner:
        description: "Where to run: GitHub's servers, or your own computer (self-hosted runner)"
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and caption font (GitHub servers only)
        if: ${{ runner.environment == 'github-hosted' }}
        timeout-minutes: 6
        run: |
          set -e
          mkdir -p "$HOME/ffmpeg" "$HOME/.local/share/fonts"
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            tar -xJf /tmp/ff.tar.xz -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            echo "static ffmpeg download failed, trying apt"
            sudo timeout 240 apt-get install -y -qq ffmpeg
          fi
          curl -fsSL --max-time 60 -o "$HOME/.local/share/fonts/Montserrat-Bold.ttf" \
            https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf \
            || echo "font download failed, default font will be used"
          fc-cache -f > /dev/null 2>&1 || true

      - name: Check ffmpeg
        run: ffmpeg -hide_banner -filters | grep -q " ass " && echo "ffmpeg OK (captions supported)"

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -q -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Create release for this run's clips
        id: rel
        run: |
          TAG="clips-$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --prerelease --title "🎬 Clips — $(date -u '+%d %b %H:%M') UTC" \
            --notes "Watching… clips appear here as they're made."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### 📱 Clips: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Watch streams and clip
        env:
          SELF_HOSTED: ${{ runner.environment != 'github-hosted' }}
          GITHUB_RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          HOURS: ${{ inputs.hours }}
          CHANNELS: ${{ inputs.channels }}
          TOP_N: ${{ inputs.top_n }}
          SENS: ${{ inputs.sensitivity }}
          MODE: ${{ inputs.mode }}
        run: |
          [ "$MODE" = "campaigns" ] && CM="--set campaign_mode=true" || CM="--set campaign_mode=false"
          MIN=$(python -c "import os; print(min(float(os.environ['HOURS'] or 5.5), 5.5) * 60 - 12)")
          case "$SENS" in
            "more clips")  S="--set detection.ratio_threshold=1.8 --set detection.z_threshold=3" ;;
            "fewer clips") S="--set detection.ratio_threshold=3 --set detection.z_threshold=4.5" ;;
            *) S="" ;;
          esac
          python main.py --minutes "$MIN" --channels "$CHANNELS" $CM $S \
            --set discovery.top_n="$TOP_N" \
            --set recording.quality='"720p30,720p,480p,best"' \
            $( [ "$SELF_HOSTED" = "true" ] || echo "--set edit.whisper_model=base --set edit.whisper_device=cpu --set edit.caption_font=Montserrat" )

      - name: Keep going — start the next run
        if: ${{ !cancelled() && inputs.keep_going }}
        run: |
          gh workflow run clip.yml --ref "${GITHUB_REF_NAME}" \
            -f hours="${{ inputs.hours }}" -f channels="${{ inputs.channels }}" \
            -f top_n="${{ inputs.top_n }}" -f sensitivity="${{ inputs.sensitivity }}" -f keep_going=true -f mode="${{ inputs.mode }}" \
            -f runner="${{ inputs.runner }}"
