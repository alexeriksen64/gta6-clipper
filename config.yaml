# ---- GTA VI auto-clipper config ----
twitch:
  # Create an app at https://dev.twitch.tv/console/apps (free). Only used to find live streams.
  client_id: ""
  client_secret: ""

game_names: ["Grand Theft Auto VI", "Grand Theft Auto 6", "GTA VI"]

discovery:
  top_n: 8                # how many of the biggest streams to watch at once (each = 1 video download)
  min_viewers: 1500
  languages: ["en"]       # [] = all languages
  refresh_seconds: 300    # re-check which streams are top
  include_channels: []    # always watch these (e.g. reaction streamers not in the GTA category)
  exclude_channels: []

recording:
  quality: "720p60,720p,480p,best"   # lower = less bandwidth; 720p is plenty for Shorts
  segment_seconds: 4
  buffer_seconds: 240                # rolling buffer kept on disk per stream

detection:
  bin_seconds: 1
  window_seconds: 6        # chat rate is measured over this window
  baseline_seconds: 300    # "normal" chat speed is learned over ~5 min
  warmup_seconds: 90       # don't trigger until a baseline exists
  z_threshold: 3.5         # how many std-devs above normal
  ratio_threshold: 2.3     # AND at least this many times normal speed
  min_msgs_per_sec: 3      # ignore tiny chats
  cooldown_seconds: 90     # per channel, avoid duplicate clips of the same moment
  hype_tokens: [KEKW, OMEGALUL, LUL, LULW, ICANT, LMAO, LMFAO, Pog, PogChamp, POGGERS, Pog, W, L, "?", "???",
                monkaS, monkaW, Clueless, Aware, "o7", HUH, WAYTOO, Kappa, "GG", "CLIP", "CLIPPED", "+2", "-2"]

clip:
  pre_seconds: 28          # video kept before chat starts exploding (chat reacts late)
  post_seconds: 12         # video kept after the trigger
  latency_offset_seconds: 0  # shift clip window if clips start too early (+) or late (-)

edit:
  enabled: true
  format: vertical         # vertical (9:16 Shorts/TikTok/Reels) | horizontal (16:9)
  layout: blur             # vertical only: blur (full frame on blurred bg) | crop (center crop)
  whisper_model: small     # tiny/base/small/medium/large-v3 — larger = better captions, slower
  whisper_device: auto     # auto | cpu | cuda
  language: en             # null = auto-detect
  words_per_caption: 3
  caption_font: "Arial Black"  # any installed font (Montserrat/Poppins look great); falls back if missing
  caption_size: 88
  highlight_color: "&H0000E5FF"   # ASS BGR colour of the active word (yellow)
  credit: true             # "twitch.tv/<channel>" tag at the top
  workers: 1               # parallel edit jobs (whisper is the slow part)
  cold_open: true          # start with the 2.5s peak moment as a hook, then play the clip
  hook_title: true         # big title at the top made from the streamer's own words at the moment

# Paid clipping campaigns. With `campaign_mode: true` ONLY these channels are watched,
# and clips are only made while the channel is streaming one of `game_names` (checked via the
# Twitch API every few minutes when keys are set).
campaign_mode: true
campaigns:
  - name: "Kai Cenat - $10K GTA 6 Pool"
    url: https://contentrewards.com/c/campaigns/1d2bcb00-c904-415f-aa82-f95b96baad86
    channels: [kaicenat]
    require_game: true            # rule: Kai playing GTA 6 must be the main focus
    hashtags: ["#KaiCenat", "#GTA6", "#GTAVI"]   # #KaiCenat is required by the campaign
    credit: "twitch.tv/kaicenat"
    platforms: [TikTok, YouTube Shorts, Instagram Reels, X]
    # Pool: 1K views per clip to count, 750K total views to qualify, paid when the pool ends.

  - name: "Boeshi GTA 6 Clipping ($1/1K)"
    url: https://contentrewards.com/c/campaigns/5c01ecdb-a148-4489-ba26-5aadbbb5bf69
    # $1/1K views, min payout $3 per clip (= 3,000 views on ONE post), max $300 per clip
    channels: [darealboeshi]
    require_game: true            # rule: only his recent GTA 6 streams
    # Rule: tag his Twitch in every caption. One of these is picked at random per clip.
    caption_text:
      - "FULL STREAM at twitch.tv/darealboeshi"
      - "Watch the full stream 👉 twitch.tv/darealboeshi"
      - "He really said this live 💀 Full stream at twitch.tv/darealboeshi"
      - "Catch Boeshi LIVE at twitch.tv/darealboeshi"
      - "Full VOD on twitch.tv/darealboeshi 🎮"
    hashtags: ["#Boeshi", "#GTA6", "#GTAVI"]
    credit: ""                    # the required Twitch overlay already credits him
    platforms: [TikTok, Instagram Reels, YouTube Shorts]
    detection:                    # works for small and big chats alike
      min_msgs_per_sec: 2.0
      window_seconds: 10
    # REQUIRED: the campaign's Twitch overlay, uploaded to logos/ (any file ending is fine).
    # Clips without it are flagged on the release page and must not be submitted.
    logo: logos/boeshi.png
    logo_position: top-center
    logo_width: 640
    # Other rules: 40%+ US/UK/CA/AU audience, 0.8%+ engagement, keep posts up 30+ days,
    # max 5 near-identical posts, warm up new accounts, no misleading captions.
    # Brief wants: jokes about his voice, the mewing when he focuses or is scared, "chad" moments,
    # relatable meme captions ("me in class when it's show and tell day").

  - name: "Bobby Vanriper GTA VI Clipping"
    url: https://contentrewards.com/c/campaigns/f583b069-ced7-49e5-9ed3-2d3a13d6df0c
    channels: [bobby_vanriper]
    require_game: true            # rule: GTA VI streams only, non-GTA clips are rejected
    # CTA rule: mention Bobby + where to watch him. One line is picked at random per clip.
    caption_text:
      - "Follow Bobby Vanriper on Twitch 👉 twitch.tv/bobby_vanriper"
      - "Catch Bobby LIVE every day at twitch.tv/bobby_vanriper"
      - "Bobby Vanriper streams GTA 6 daily 🎮 twitch.tv/bobby_vanriper"
      - "Watch Bobby Vanriper live on Twitch: twitch.tv/bobby_vanriper"
    hashtags: ["#bobbyvanriper"]  # required on every post
    hashtag_pool: ["#gta6", "#gtavi", "#twitch", "#streamer", "#twitchclips", "#gaming", "#funnymoments"]
    hashtag_pool_pick: 3          # brief says to mix hashtags up between posts
    credit: "FOLLOW twitch.tv/bobby_vanriper"   # on-screen CTA + his Twitch link
    platforms: [TikTok, Instagram Reels, YouTube Shorts]
    viewer_clips: true            # also clip every moment his viewers make a Twitch clip of
    detection:                    # ~100 viewers: tuned so slow chat still triggers, no false alarms
      min_msgs_per_sec: 1.0
      window_seconds: 15
      ratio_threshold: 3.0
    # Rules: English only, likes visible, 1%+ engagement, 40%+ Tier 1 audience (send demographics
    # screen recording in their Discord at 1,500 views), submit within 30 min, keep posts up 30 days,
    # gaming/streamer/clips page only, max 5 near-identical posts. Overlay optional.

# Campaigns that stack ON TOP of the streamer campaigns above: every clip also gets their logo
# and hashtags, and the release page says "Also submit to …".
stack_campaigns:
  - name: "GTA VI Clipup Logo"
    url: ""                       # paste the campaign link to show it on the release page
    logo: logos/clipup.png        # their "Hire Clippers — 1B+ Views Generated" banner (any file ending)
    logo_width: 900               # big and unshrunk-looking; sits right under the gameplay, never covered
    hashtags: ["#gta6", "#Clipup"]
    apply_to: [kaicenat]          # only Kai clips get the ClipUp logo (use "all" for every streamer)
    # Rules: logo on screen the whole clip, never covered/stretched/recoloured/cropped,
    # streamer gameplay only, keep posts up 60+ days, no other creators' watermarks.

output_dir: clips
work_dir: work
